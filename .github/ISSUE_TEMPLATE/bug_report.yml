name: Bug report / Błąd
description: Something does not work in HEXART Video Edit. / Coś nie działa w HEXART Video Edit.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        The easiest way is the bug report button in the app: it adds the version, log and device info.
        This form is for manual reports. The issue is public: do not paste passwords, keys or client data.

        Najłatwiej zgłosić błąd przyciskiem w programie: dołącza wersję, log i dane urządzenia.
        Ten formularz jest do zgłoszeń ręcznych. Issue jest publiczne: nie wklejaj haseł, kluczy ani danych klientów.
  - type: input
    id: version
    attributes:
      label: Version / Wersja
      description: "Output of `hve.exe --version` or the version in the About window. / Wynik `hve.exe --version` albo wersja z okna O programie."
      placeholder: "0.15.0"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System and graphics card / System i karta graficzna
      placeholder: "Windows 11 24H2, NVIDIA RTX 4070, driver / sterownik 5xx.xx"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Kroki do odtworzenia
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected / Czego oczekiwałeś
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened / Co się stało
      description: Add a screenshot if it helps (drag it here). / Jeśli to pomaga, dodaj zrzut ekranu (przeciągnij go tutaj).
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: "Log folder: `%APPDATA%\\HEXART\\HEXART Video Edit\\data\\logs`. Paste the tail of the newest file and remove paths or names you do not want to share. / Folder z logami: `%APPDATA%\\HEXART\\HEXART Video Edit\\data\\logs`. Wklej końcówkę najnowszego pliku i usuń ścieżki oraz nazwy, których nie chcesz ujawniać."
      render: text
